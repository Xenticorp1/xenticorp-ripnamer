name: Release

on:
  push:
    tags: ["v*"]
  # Actions tab → Release → "Run workflow": builds both downloads as workflow artifacts
  # (named after the branch) without publishing a release. Use it to test a build first.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      # The version goes into the download file names, so the tag and the app must agree.
      - name: Tag matches app version
        if: github.ref_type == 'tag'
        run: |
          app=$(python -c "import ripnamer_app; print(ripnamer_app.VERSION)")
          [ "v$app" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match VERSION $app in ripnamer_app/__init__.py"; exit 1; }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Release builds never carry a TMDb key: users bring their own.
      - name: Refuse a baked-in key
        shell: bash
        run: test ! -e ripnamer_key.py || { echo "ripnamer_key.py must not exist in CI"; exit 1; }
      # Antivirus tools (Defender especially) flag PyInstaller's prebuilt Windows launcher, which
      # malware reuses. Compiling our own from the sdist (MSVC is on the runner) avoids matching it.
      - name: Install build tools (PyInstaller launcher compiled from source)
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install --no-binary pyinstaller --no-cache-dir pyinstaller
          python -m pip install --upgrade sv-ttk pillow
      - name: Check the launcher really was compiled here
        shell: bash
        run: |
          ver=$(python -c "import PyInstaller; print(PyInstaller.__version__)")
          python -m pip download --no-deps --only-binary :all: -d prebuilt "pyinstaller==$ver" >/dev/null
          python - <<'PY'
          import glob, hashlib, os, zipfile, PyInstaller
          rel = "PyInstaller/bootloader/Windows-64bit-intel/runw.exe"
          ours = hashlib.sha256(open(os.path.join(os.path.dirname(PyInstaller.__file__), *rel.split("/")[1:]), "rb").read()).hexdigest()
          with zipfile.ZipFile(glob.glob("prebuilt/*.whl")[0]) as z:
              stock = hashlib.sha256(z.read(rel)).hexdigest()
          print(f"PyInstaller {PyInstaller.__version__}\n  compiled launcher: {ours}\n  prebuilt launcher: {stock}")
          if ours == stock:
              raise SystemExit("The launcher is the prebuilt one: compiling from source didn't happen.")
          PY
          rm -rf prebuilt
      - name: Write version_info.txt from VERSION
        run: python make_version_info.py
      - name: Build (same flags as build.bat)
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "Xenticorp Ripnamer" --collect-data sv_ttk
          --icon xenticorp.ico --add-data "xenticorp.ico;."
          --version-file version_info.txt ripnamer.py
      - name: Rename asset
        shell: bash
        run: mv "dist/Xenticorp Ripnamer.exe" "dist/Xenticorp-Ripnamer-${GITHUB_REF_NAME}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Xenticorp-Ripnamer-*.exe
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Release builds never carry a TMDb key: users bring their own.
      - name: Refuse a baked-in key
        run: test ! -e ripnamer_key.py || { echo "ripnamer_key.py must not exist in CI"; exit 1; }
      - name: Install build tools
        run: python -m pip install --upgrade pyinstaller sv-ttk
      - name: Build (same flags as build.sh)
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name xenticorp-ripnamer --collect-data sv_ttk
          --add-data "xenticorp.png:." ripnamer.py
      - name: Rename asset
        run: mv dist/xenticorp-ripnamer "dist/xenticorp-ripnamer-${GITHUB_REF_NAME}-linux-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/xenticorp-ripnamer-*-linux-x86_64
          if-no-files-found: error

  release:
    needs: [windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: |
          chmod +x xenticorp-ripnamer-*-linux-x86_64
          sha256sum Xenticorp-Ripnamer-*.exe xenticorp-ripnamer-*-linux-x86_64 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Binaries carry the tag (Xenticorp-Ripnamer-v3.1.0.exe); Xenticorp.net finds them
      # through the GitHub API. SHA256SUMS.txt keeps a fixed name for /releases/latest/download/.
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            assets/Xenticorp-Ripnamer-*.exe
            assets/xenticorp-ripnamer-*-linux-x86_64
            assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
